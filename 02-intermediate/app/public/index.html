<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terraform Training App</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .container {
        text-align: center;
        background: white;
        padding: 60px 80px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
      }

      .emoji {
        font-size: 80px;
        margin-bottom: 20px;
      }

      h1 {
        color: #333;
        font-size: 2.5rem;
        margin-bottom: 15px;
      }

      .highlight {
        color: #667eea;
      }

      p {
        color: #666;
        font-size: 1.2rem;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .badge {
        display: inline-block;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 10px 25px;
        border-radius: 50px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .info {
        margin-top: 40px;
        padding-top: 30px;
        border-top: 1px solid #eee;
      }

      .info p {
        font-size: 0.95rem;
        color: #888;
        margin-bottom: 10px;
      }

      .edit-hint {
        background: #f8f9fa;
        padding: 15px 20px;
        border-radius: 10px;
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="emoji">👋</div>
      <h1>Hi! Welcome to <span class="highlight">Terraform Training</span></h1>
      <p>
        This app was deployed to Azure App Service using infrastructure created
        with Terraform. Pretty cool, right?
      </p>
      <span class="badge">🚀 Deployed with Terraform + Azure CLI</span>

      <div class="info">
        <p>✏️ Want to customize this page? Edit the file:</p>
        <div class="edit-hint">app/public/index.html</div>
      </div>
    </div>
  </body>
</html>
